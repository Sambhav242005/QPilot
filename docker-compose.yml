version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qpilot-postgres
    environment:
      POSTGRES_DB: qpilot
      POSTGRES_USER: qpilot
      POSTGRES_PASSWORD: qpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qpilot-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://qpilot:qpilot@postgres:5432/qpilot
      - LLM_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL_NAME=gemma4:31b-cloud
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qpilot-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
